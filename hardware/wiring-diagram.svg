<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#111">Robot Car — Wiring Diagram</text>

  <!-- Legend -->
  <line x1="40" y1="60" x2="70" y2="60" stroke="#c0392b" stroke-width="3"/>
  <text x="78" y="64" font-size="12" fill="#333">Battery power (3.7V, direct)</text>
  <line x1="260" y1="60" x2="290" y2="60" stroke="#16794f" stroke-width="3"/>
  <text x="298" y="64" font-size="12" fill="#333">Regulated logic power (5.2V, Verter out)</text>
  <line x1="580" y1="60" x2="610" y2="60" stroke="#1a5fa5" stroke-width="3"/>
  <text x="618" y="64" font-size="12" fill="#333">Ground</text>
  <line x1="700" y1="60" x2="730" y2="60" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="738" y="64" font-size="12" fill="#333">Signal</text>

  <!-- Battery -->
  <rect x="30" y="100" width="110" height="50" rx="6" fill="#fdecec" stroke="#c0392b"/>
  <text x="85" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Li-Ion 3.7V</text>
  <text x="85" y="138" text-anchor="middle" font-size="11" fill="#555">525mAh cell</text>

  <!-- TP4056 -->
  <rect x="200" y="100" width="110" height="50" rx="6" fill="#fdecec" stroke="#c0392b"/>
  <text x="255" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#111">TP4056</text>
  <text x="255" y="138" text-anchor="middle" font-size="11" fill="#555">USB-C charger</text>

  <!-- USB-C -->
  <rect x="200" y="30" width="110" height="36" rx="6" fill="#f0f0f0" stroke="#888"/>
  <text x="255" y="53" text-anchor="middle" font-size="11" fill="#333">USB-C (charging only)</text>
  <line x1="255" y1="66" x2="255" y2="100" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Battery to TP4056 -->
  <line x1="140" y1="118" x2="200" y2="118" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="112" text-anchor="middle" font-size="10" fill="#c0392b">B+</text>
  <line x1="140" y1="138" x2="200" y2="138" stroke="#1a5fa5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="152" text-anchor="middle" font-size="10" fill="#1a5fa5">B-</text>

  <!-- Switch -->
  <rect x="370" y="100" width="90" height="50" rx="6" fill="#f0f0f0" stroke="#888"/>
  <text x="415" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Switch</text>
  <text x="415" y="138" text-anchor="middle" font-size="11" fill="#555">main power</text>
  <line x1="310" y1="118" x2="370" y2="118" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="112" text-anchor="middle" font-size="10" fill="#c0392b">OUT+</text>

  <!-- Power junction: soldered directly, no breadboard -->
  <rect x="540" y="90" width="320" height="70" rx="6" fill="#fafafa" stroke="#999"/>
  <text x="700" y="106" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Power junction (soldered directly — no breadboard)</text>
  <rect x="555" y="115" width="290" height="10" fill="#c0392b" opacity="0.75"/>
  <text x="850" y="123" font-size="10" fill="#c0392b">+ (3.7V raw)</text>
  <rect x="555" y="135" width="290" height="10" fill="#1a5fa5" opacity="0.75"/>
  <text x="850" y="143" font-size="10" fill="#1a5fa5">− (GND)</text>

  <line x1="460" y1="118" x2="555" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="145" x2="200" y2="180" stroke="#1a5fa5" stroke-width="2"/>
  <line x1="200" y1="180" x2="700" y2="180" stroke="#1a5fa5" stroke-width="2"/>
  <line x1="700" y1="180" x2="700" y2="140" stroke="#1a5fa5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="196" text-anchor="middle" font-size="10" fill="#1a5fa5">OUT− shared ground back to junction</text>

  <!-- Verter -->
  <rect x="540" y="210" width="120" height="50" rx="6" fill="#e8f6ef" stroke="#16794f"/>
  <text x="600" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Verter</text>
  <text x="600" y="248" text-anchor="middle" font-size="11" fill="#555">buck-boost → 5.2V</text>
  <line x1="600" y1="160" x2="600" y2="210" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="185" font-size="10" fill="#c0392b">VIN+ (raw)</text>

  <!-- TB6612FNG -->
  <rect x="30" y="330" width="160" height="110" rx="6" fill="#eef0fb" stroke="#4b4bb0"/>
  <text x="110" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#111">TB6612FNG</text>
  <text x="110" y="368" text-anchor="middle" font-size="11" fill="#555">dual motor driver</text>
  <text x="110" y="386" text-anchor="middle" font-size="10" fill="#555">VM: motor power</text>
  <text x="110" y="400" text-anchor="middle" font-size="10" fill="#555">VCC: logic (5.2V)</text>
  <text x="110" y="414" text-anchor="middle" font-size="10" fill="#555">STBY: HIGH to run</text>
  <text x="110" y="428" text-anchor="middle" font-size="10" fill="#555">AIN1/2, BIN1/2, PWMA/B</text>

  <!-- Motor power: junction to TB6612 VM, direct not through Verter -->
  <line x1="555" y1="128" x2="130" y2="128" stroke="#c0392b" stroke-width="2"/>
  <line x1="130" y1="128" x2="130" y2="330" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="145" y="230" font-size="10" fill="#c0392b">VM (raw 3.7V, direct — high current)</text>

  <!-- Verter to TB6612 VCC -->
  <line x1="540" y1="235" x2="400" y2="235" stroke="#16794f" stroke-width="2"/>
  <line x1="400" y1="235" x2="400" y2="375" stroke="#16794f" stroke-width="2"/>
  <line x1="400" y1="375" x2="190" y2="375" stroke="#16794f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="368" text-anchor="middle" font-size="10" fill="#16794f">VCC (logic 5.2V)</text>

  <!-- Metro M0 -->
  <rect x="240" y="330" width="150" height="110" rx="6" fill="#e6f1fb" stroke="#1a5fa5"/>
  <text x="315" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Metro M0</text>
  <text x="315" y="368" text-anchor="middle" font-size="11" fill="#555">Express</text>
  <text x="315" y="388" text-anchor="middle" font-size="10" fill="#555">5V pin ← Verter</text>
  <text x="315" y="402" text-anchor="middle" font-size="10" fill="#555">GND ← shared junction</text>
  <text x="315" y="416" text-anchor="middle" font-size="10" fill="#555">RX ← HUZZAH TX</text>
  <text x="315" y="430" text-anchor="middle" font-size="10" fill="#555">pins 4,5,6,7,8,9,3 → driver</text>

  <!-- Verter to Metro 5V -->
  <line x1="600" y1="260" x2="600" y2="300" stroke="#16794f" stroke-width="2"/>
  <line x1="600" y1="300" x2="315" y2="300" stroke="#16794f" stroke-width="2"/>
  <line x1="315" y1="300" x2="315" y2="330" stroke="#16794f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HUZZAH -->
  <rect x="470" y="330" width="150" height="110" rx="6" fill="#eef0fb" stroke="#7f4bb0"/>
  <text x="545" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#111">Feather HUZZAH</text>
  <text x="545" y="368" text-anchor="middle" font-size="11" fill="#555">ESP8266, web server</text>
  <text x="545" y="388" text-anchor="middle" font-size="10" fill="#555">USB pin ← Verter</text>
  <text x="545" y="402" text-anchor="middle" font-size="10" fill="#555">GND ← shared junction</text>
  <text x="545" y="416" text-anchor="middle" font-size="10" fill="#555">TX → Metro RX</text>

  <!-- Verter to HUZZAH USB pin -->
  <line x1="620" y1="260" x2="620" y2="300" stroke="#16794f" stroke-width="2"/>
  <line x1="620" y1="300" x2="545" y2="300" stroke="#16794f" stroke-width="2"/>
  <line x1="545" y1="300" x2="545" y2="330" stroke="#16794f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HUZZAH TX to Metro RX -->
  <line x1="470" y1="380" x2="390" y2="380" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Metro to TB6612 signal pins -->
  <line x1="240" y1="400" x2="190" y2="400" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="215" y="392" text-anchor="middle" font-size="9" fill="#555">AIN1/2,PWMA</text>
  <text x="215" y="412" text-anchor="middle" font-size="9" fill="#555">BIN1/2,PWMB,STBY</text>

  <!-- Motors -->
  <rect x="30" y="500" width="100" height="50" rx="6" fill="#f5f5f5" stroke="#888"/>
  <text x="80" y="522" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Motor L</text>
  <text x="80" y="538" text-anchor="middle" font-size="10" fill="#555">TT motor</text>

  <rect x="150" y="500" width="100" height="50" rx="6" fill="#f5f5f5" stroke="#888"/>
  <text x="200" y="522" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Motor R</text>
  <text x="200" y="538" text-anchor="middle" font-size="10" fill="#555">TT motor</text>

  <line x1="70" y1="440" x2="80" y2="500" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="55" y="470" font-size="9" fill="#c0392b">AO1/AO2</text>
  <line x1="150" y1="440" x2="200" y2="500" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="470" font-size="9" fill="#c0392b">BO1/BO2</text>

  <!-- Ground return note -->
  <rect x="30" y="580" width="820" height="44" rx="6" fill="#f6f6f6" stroke="#ccc"/>
  <text x="440" y="598" text-anchor="middle" font-size="11" fill="#333" font-weight="600">All GND pins (Metro M0, HUZZAH, TB6612FNG, Verter) share one common ground, soldered together directly.</text>
  <text x="440" y="614" text-anchor="middle" font-size="10" fill="#555">This is required for logic-level signals to be interpreted correctly across separate power domains.</text>
</svg>
